name: CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v7

      - name: 2. Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 3 & 4. Install dependencies (npm ci)
        run: npm ci

      - name: 5. Run ESLint
        run: npm run lint

      - name: 6. Run TypeScript typecheck
        run: npm run typecheck

      - name: 7. Run unit & smoke tests
        run: npm run test

      - name: 8. Run production build
        run: npm run build
